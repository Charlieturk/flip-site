<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLIP: The Dealer</title>
<style>
  :root{--bg:#120a24;--gold:#ffd86b;--cyan:#5fe3ff;--pink:#b06bff;--ink:#ece6ff;--dim:#a99fd0;}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(circle at 50% 0%,#1d1140,#0d0720);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.6;min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .wrap{max-width:560px;margin:0 auto;padding:48px 24px;text-align:center;}
  .logo{font-size:54px;font-weight:800;letter-spacing:2px;background:linear-gradient(90deg,var(--cyan),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .tag{color:var(--gold);font-size:17px;letter-spacing:3px;text-transform:uppercase;margin-top:2px;}
  p{color:var(--dim);font-size:16px;margin:24px 0;}
  .links{margin-top:30px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  .links a{display:inline-block;padding:12px 22px;border-radius:11px;border:2px solid var(--pink);color:var(--ink);text-decoration:none;font-weight:600;}
  .links a:hover{background:var(--pink);}
  footer{margin-top:40px;color:var(--dim);font-size:13px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">FLIP</div>
  <div class="tag">The Dealer</div>
  <p>Buy low, flip high. Run a watch &amp; diamond dealer's desk &mdash; roll, haggle, spot fakes, chase grails, and climb from street hustler to living legend.</p>
  <div class="links">
    <a href="support.html">Support</a>
    <a href="privacy.html">Privacy Policy</a>
  </div>
  <footer>&copy; 2026 Arda &Ouml;zyamano&#287;lu</footer>
</div>
</body>
</html>
